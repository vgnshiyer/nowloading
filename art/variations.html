<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nowloading · themes</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1e1d; --muted: #8b8984; --faint: #b8b6af; --line: #edebe6; --chip: #f6f5f2; --accent: #d97757;
  }
  body.dark {
    --bg: #262624; --fg: #ebe9e2; --muted: #9d9b93; --faint: #6c6a64; --line: #393835; --chip: #2f2e2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; transition: background .2s, color .2s; }
  main { max-width: 820px; margin: 0 auto; padding: 30px 28px 64px; }
  h1 { font-size: 19px; line-height: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--muted); font-size: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 6px; align-items: center; }
  .controls button { font: inherit; font-size: 12.5px; line-height: 16px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--muted); cursor: pointer; }
  .controls button.on { color: var(--fg); border-color: var(--faint); }
  .controls .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  .now { font-size: 12.5px; color: var(--faint); margin-left: auto; }
  section { margin-top: 30px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .blurb { color: var(--faint); font-size: 13px; margin: 0 0 6px; }
  .variant { display: grid; grid-template-columns: 112px 1fr; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
  .caption { font-size: 12px; line-height: 15px; color: var(--faint); }
  .caption b { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; }
  /* One line of the Code tab's turn status: art where the dots are, then the step and the time */
  .row { display: flex; align-items: center; height: 20px; color: var(--muted); white-space: nowrap; min-width: 0; }
  .art { display: inline-flex; align-items: center; height: 20px; flex-shrink: 0; }
  .art svg, .tail svg { display: block; }
  .text { margin-left: 8px; overflow: hidden; text-overflow: ellipsis; }
  .tail { margin-left: 8px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; flex-shrink: 0; }
  .chev { margin-left: 6px; color: var(--faint); flex-shrink: 0; }
  .native .variant { border-top: 0; padding-top: 4px; }
  code { font: 12.5px ui-monospace, Menlo, monospace; color: var(--fg); }
  .caption code { font-size: 12px; color: var(--muted); }
</style>
<body>
<main>
  <h1>nowloading · themes</h1>
  <p class="lede">Each row is the Code tab's turn line: the art takes the place of the dots, and the step and the real time stay. Every look is its own theme, picked with <code>/nowloading &lt;name&gt;</code>. A scripted turn plays on a loop.</p>
  <div class="controls" id="controls"></div>
  <section class="native">
    <div class="variant"><div class="caption"><b>Today</b>native</div><div class="row" id="native"></div></div>
  </section>
  <div id="themes"></div>
</main>
<script type="module">
// Served from the repo root (python3 -m http.server): the demo draws the mod's own theme modules.
import { svg, nativeTime } from '../themes/kit.js'
import { FAMILIES } from '../themes/index.js'
import { SCRIPT, STEP_MS, snapshot } from './turn.js'
const families = FAMILIES
const CHEVRON = '<svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const DOTS = s => svg(14, s.mode === 'done' ? '' : [[3.5, 7], [9.5, 7], [6.5, 12.5]].map(([x, y], i) =>
  `<circle cx="${x}" cy="${y}" r="1.9" fill="#d97757"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" begin="${-i * 0.4}s" repeatCount="indefinite"/></circle>`).join(''))

const rows = []
document.getElementById('native').innerHTML = `<span class="art"></span><span class="text"></span><span class="tail"></span>${CHEVRON}`
rows.push({ el: document.getElementById('native'), look: { art: DOTS } })
const host = document.getElementById('themes')
for (const fam of families) {
  const looks = fam.looks
  const sec = document.createElement('section')
  sec.innerHTML = `<h2>${fam.title}</h2><p class="blurb">${fam.blurb}</p>`
  looks.forEach(look => {
    const v = document.createElement('div')
    v.className = 'variant'
    v.innerHTML = `<div class="caption"><b><code>${look.name}</code></b>${look.note}</div>` +
      `<div class="row"><span class="art"></span><span class="text"></span><span class="tail"></span>${CHEVRON}</div>`
    sec.appendChild(v)
    rows.push({ el: v.querySelector('.row'), look })
  })
  host.appendChild(sec)
}

let step = 0, pinned = null, turnStart = performance.now(), warp = 0
const elapsed = () => (performance.now() - turnStart) / 1000 + warp
function draw() {
  const s = snapshot(step, elapsed())
  for (const row of rows) {
    const { el, look } = row
    // Like the desktop: an unchanged picture keeps running, a changed one starts over
    const markup = look.art(s)
    if (markup !== row.markup) { el.querySelector('.art').innerHTML = markup; row.markup = markup }
    el.querySelector('.text').textContent = s.mode === 'done' ? s.text : `${s.text}…`
  }
  tick()
  for (const b of document.querySelectorAll('[data-step]')) b.classList.toggle('on', pinned === +b.dataset.step)
  document.querySelector('[data-auto]').classList.toggle('on', pinned === null)
}
function tick() {
  const s = snapshot(step, elapsed())
  for (const { el, look } of rows) {
    el.querySelector('.tail').innerHTML = look.tail ? look.tail(s) : nativeTime(s.elapsed)
    look.tick?.(el.querySelector('.art'), s)
  }
}
function advance() {
  if (pinned !== null) return
  step = (step + 1) % SCRIPT.length
  if (step === 0) turnStart = performance.now()
  draw()
}

const controls = document.getElementById('controls')
const add = (label, onClick, attr) => {
  const b = document.createElement('button'); b.textContent = label; b.onclick = onClick
  if (attr) b.setAttribute(attr[0], attr[1])
  controls.appendChild(b); return b
}
add('Auto', () => { pinned = null; draw() }, ['data-auto', ''])
;[['Working', 0], ['Thinking', 1], ['Tool running', 4], ['Tool failed', 5], ['Writing', 11], ['Done', 12]].forEach(([label, i]) =>
  add(label, () => { pinned = i; step = i; draw() }, ['data-step', String(i)]))
controls.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }))
const warpButton = add('Long turn (16m)', () => { warp = warp ? 0 : 16 * 60 + 25; warpButton.classList.toggle('on', !!warp); draw() })
const themeButton = add('Dark', () => { document.body.classList.toggle('dark'); themeButton.textContent = document.body.classList.contains('dark') ? 'Light' : 'Dark' })
if (matchMedia('(prefers-color-scheme: dark)').matches) { document.body.classList.add('dark'); themeButton.textContent = 'Light' }

draw()
setInterval(tick, 1000)
setInterval(advance, STEP_MS)
</script>
</body>
</html>
